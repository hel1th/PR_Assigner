run:
  timeout: 5m
  issues-exit-code: 1
  skip-dirs:
    - test

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - unused
    - gofmt
    - goimports
    - revive
    - gocritic

linters-settings:
  gofmt:
    simplify: true
  revive:
    ignore-generated-header: true
    severity: warning
    rules:
      - name: var-naming
        severity: warning
      - name: import-shadowing
        severity: error

issues:
  exclude-rules:
    - linters:
        - errcheck
      text: "Close"
    - linters:
        - errcheck
      text: "Rollback"
    - linters:
        - errcheck
      text: "Encode"
    - linters:
        - gocritic
      text: "log.Fatal"
    - linters:
        - revive
      text: "should have comment"
